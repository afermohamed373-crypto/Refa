<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refa</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.ico{vertical-align:-.15em;display:inline-block}
:root{--cy:#c8d6c3;--mid:#718b75;--navy:#344b3b;--bg:#f5f4ee;--card:#fffefa;--tx:#29372e;--mu:#7c877e;--ln:#e4e7df;--mk:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d24;--card:#0e1a3d;--tx:#eaf1ff;--mu:#8fa0cc;--ln:#1c2b5a;--mk:brightness(0) invert(1)}}
:root[data-theme="dark"]{--bg:#060d24;--card:#0e1a3d;--tx:#eaf1ff;--mu:#8fa0cc;--ln:#1c2b5a;--mk:brightness(0) invert(1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-size:13px;line-height:1.4;font-family:Outfit,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[lang=ar] body,[lang=ar] input,[lang=ar] button,[lang=ar] select,[lang=ar] textarea{font-family:Cairo,Outfit,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.screen{display:none;height:100%;width:100%;max-width:440px;margin:auto;position:relative;overflow:hidden}
.screen.on{display:flex;flex-direction:column}
#login{max-width:none;background:linear-gradient(135deg,#041046,#0a3a9c 50%,#0099d8);align-items:center;justify-content:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:drift 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#00d1ff;top:-80px;left:-60px}
.b2{width:300px;height:300px;background:#1b4fd8;bottom:-60px;right:-40px;animation-duration:18s}
.b3{width:220px;height:220px;background:#5ae6ff;top:45%;left:55%;animation-duration:11s;opacity:.45}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:3}
.lang select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 14px;backdrop-filter:blur(8px)}
.lang option{color:#0b1b45}
.glass{position:relative;z-index:2;width:min(400px,92%);padding:24px 22px;border-radius:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px);color:#fff;display:flex;flex-direction:column;gap:12px;max-height:96%;overflow:auto}
.logo{text-align:center}
.logo img{height:68px;filter:brightness(0) invert(1)}
.logo b{display:block;font-size:28.5px;margin-top:4px}
.glass input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;outline:none}
.glass input::placeholder{color:rgba(255,255,255,.7)}
.glass input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:600;cursor:pointer;width:100%}
.pri{background:#fff;color:var(--navy)}
.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff}
.sep{display:flex;align-items:center;gap:10px;font-size:11px;opacity:.85}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.4)}
.soc{display:flex;gap:8px}
.soc button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:11px}
.soc i{font-style:normal;font-weight:700;display:block;font-size:14.5px}
.sm{font-size:11px;text-align:center;opacity:.85}
#app{background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--card)}
.top img{height:30px;filter:var(--mk)}
.top .r{display:flex}
.top button,.ic{background:none;border:0;font-size:17.5px;cursor:pointer;padding:6px;position:relative}
.bd{position:absolute;top:0;inset-inline-end:0;background:#ef3b5d;color:#fff;font-size:8.5px;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.pages{flex:1;overflow:auto;position:relative}
.pg{display:none;min-height:100%}.pg.on{display:block}
#reels.on{display:block;height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
.nav button{flex:1;padding:11px 0 9px;background:none;border:0;font-size:17px;cursor:pointer;color:var(--mu)}
.nav button span{display:block;font-size:9px;margin-top:2px}
.nav button.on{color:var(--mid)}
.stories{display:flex;gap:14px;padding:14px 14px 10px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--ln)}
.st{flex:none;width:68px;text-align:center;font-size:10px;cursor:pointer;background:none;border:0}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(var(--cy),var(--mid),var(--navy),var(--cy));margin-bottom:5px}
.ring.me{background:var(--ln)}
.av{width:100%;height:100%;border-radius:50%;border:3px solid var(--card);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background-size:cover;background-position:center}
.post{background:var(--card);margin-top:8px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600;font-size:12px}
.ph .av{width:34px;height:34px;border:0;font-size:12px;flex:none}
.img{aspect-ratio:1;display:grid;place-items:center;font-size:54px}
.pa{padding:8px 10px}.pa button{background:none;border:0;font-size:19.5px;cursor:pointer;padding:4px 6px}
.cap{padding:0 14px 14px;font-size:12px}.cap b{margin-inline-end:6px}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;color:#fff;padding:20px 16px}
.reel .big{position:absolute;inset:0;display:grid;place-items:center;font-size:75.5px;opacity:.9}
.reel .info{position:relative;flex:1;font-size:12px;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.reel .side{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;text-align:center;font-size:10px}
.reel .side button{background:none;border:0;color:#fff;font-size:23.5px;cursor:pointer;display:block;margin:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:0;border-bottom:1px solid var(--ln);width:100%;text-align:start}
button.row{cursor:pointer}
.row .av{width:46px;height:46px;border:0;flex:none}
.row .g{flex:1;font-size:12px;min-width:0}
.row small{display:block;color:var(--mu);font-size:10.5px}
.sb{margin:12px 16px 8px;width:calc(100% - 32px);padding:11px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--card);outline:none}
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.chip{flex:none;padding:7px 14px;border-radius:18px;border:1px solid var(--ln);background:var(--card);cursor:pointer;font-size:11px}
.chip.on{background:linear-gradient(135deg,var(--mid),var(--navy));color:#fff;border-color:transparent}
.fb{padding:7px 14px;border-radius:10px;border:0;background:var(--mid);color:#fff;font-weight:600;cursor:pointer;font-size:11px}
.fb.o{background:var(--ln);color:var(--tx)}
.sec{padding:14px 16px 6px;font-weight:700;font-size:12.5px}
.ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.ov.on{display:flex}
#chat{z-index:5}#edit{z-index:6}#set{z-index:7}#newp{z-index:8}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msgs.chat-themed{background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:local;position:relative}
.msgs.chat-themed:before{content:"";position:fixed;inset:0;pointer-events:none;background:rgba(8,18,15,.13);z-index:0}
.msgs.chat-themed .m-line{position:relative;z-index:1}
.msgs.chat-themed .m{background:rgba(250,250,245,.9);backdrop-filter:blur(7px);color:#26352b;border-color:rgba(70,95,75,.2);box-shadow:0 3px 14px rgba(0,0,0,.08)}
.msgs.chat-themed .m.me{background:rgba(64,91,69,.88);color:#fff;border-color:rgba(255,255,255,.25)}
#chatThemeAction{display:none;position:absolute;z-index:12;bottom:76px;left:50%;transform:translateX(-50%);border:1px solid var(--ln);border-radius:24px;padding:11px 17px;background:var(--card);color:var(--tx);box-shadow:0 8px 28px rgba(0,0,0,.22);font-weight:700;white-space:nowrap}
#chatThemeAction.on{display:block}
#chatThemeChooser{display:none;position:absolute;z-index:13;inset:0;background:rgba(5,10,20,.78);align-items:center;justify-content:center;padding:22px}
#chatThemeChooser.on{display:flex}
.chat-theme-card{width:min(100%,340px);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:14px;background:#101c36;color:#fff;box-shadow:0 18px 55px rgba(0,0,0,.35)}
.chat-theme-preview{height:300px;border-radius:15px;background-position:center;background-size:cover;border:1px solid rgba(255,255,255,.25);margin:12px 0}
.chat-theme-card button{border:0;border-radius:18px;padding:11px 18px;background:#78927a;color:white;font-weight:700}
.m-line{display:flex;align-items:flex-end;gap:8px;width:100%;min-width:0}
.m-line.me{justify-content:flex-end}
.m-line:not(.me){justify-content:flex-start}
.m-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;object-fit:cover;background:#263451;border:1px solid rgba(255,255,255,.14)}
.m{max-width:min(75%,calc(100% - 40px));min-width:0;padding:10px 14px;border-radius:18px;font-size:12px;background:var(--card);align-self:flex-start;border:1px solid var(--ln);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--cy),var(--navy));color:#fff;border:0}
.msg-story-card{cursor:pointer;transition:transform .16s ease,filter .16s ease}
.msg-story-card:active{transform:scale(.98);filter:brightness(1.12)}
.send{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--ln)}
.send input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid var(--ln);background:var(--bg);outline:none}
.send button{border:0;border-radius:22px;padding:0 18px;background:var(--mid);color:#fff;cursor:pointer}
.cover{height:110px;background:linear-gradient(120deg,var(--cy),var(--mid),var(--navy));position:relative}
.cover button{position:absolute;top:10px;inset-inline-end:10px;background:rgba(0,0,0,.25);color:#fff;border-radius:50%;width:36px;height:36px;padding:0}
.pf{padding:0 18px 14px;background:var(--card)}
.pf .big{width:96px;height:96px;margin-top:-48px;border-radius:50%;border:4px solid var(--card);background:var(--ln) center/cover;display:grid;place-items:center;font-size:28.5px;font-weight:700;color:var(--mu);cursor:pointer;position:relative;z-index:2}
.pf h2{font-size:18.5px;margin-top:8px}.pf p{color:var(--mu);font-size:12px;margin-top:2px}
.stats{display:flex;gap:26px;margin:14px 0}.stats b{display:block;font-size:15px}.stats span{color:var(--mu);font-size:11px}
.pbtn{width:100%;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--mid),var(--navy));color:#fff;font-weight:600;cursor:pointer}
.ptabs{display:flex;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}
.ptabs button{flex:1;padding:12px 0;background:none;border:0;border-bottom:2px solid transparent;font-size:16px;cursor:pointer;color:var(--mu)}
.ptabs button span{display:block;font-size:9px}
.ptabs button.on{color:var(--mid);border-color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:2px;width:100%;min-width:0}
.grid>div{aspect-ratio:1;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;font-size:25px;position:relative;background-size:cover;background-position:center}
.grid>div>img,.grid>div>video{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;object-fit:cover;display:block}
.grid div i{position:absolute;top:5px;inset-inline-end:7px;font-style:normal;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.note{padding:10px 16px;font-size:11px;color:var(--mu);text-align:center}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:5px}
.form input:not([type=checkbox]),.form textarea,.form select{padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phot{display:flex;flex-direction:column;align-items:center;gap:8px}
.phot .big{width:104px;height:104px;border-radius:50%;background:var(--ln) center/cover;display:grid;place-items:center;font-size:30px;cursor:pointer}
.phot button{background:none;border:0;color:var(--mid);font-weight:600;cursor:pointer}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln);font-size:12px}
.sr small{display:block;color:var(--mu);font-size:10px;margin-top:2px}
.sr select{padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw:checked{background:var(--mid)}.sw:checked:after{inset-inline-start:21px}
.out{margin:18px 16px;padding:12px;border-radius:12px;border:1px solid #ef3b5d;background:none;color:#ef3b5d;font-weight:600;cursor:pointer}
#sv{position:absolute;inset:0;z-index:9;display:none;background:#000;color:#fff;flex-direction:column}
#sv.on{display:flex}
#sv .bar{height:3px;background:rgba(255,255,255,.3);margin:12px 12px 0;border-radius:2px;overflow:hidden}
#sv .bar i{display:block;height:100%;width:0;background:#fff}
#sv .bar i.go{width:100%;transition:width 4s linear}
#sv .body{flex:1;display:grid;place-items:center;font-size:92.5px}
#sv .who{padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
#sv button{background:none;border:0;color:#fff;font-size:18.5px;cursor:pointer}
.hd{font-weight:700}
.hide{display:none!important}
#rep{z-index:10}#sus{z-index:8}#dacc{z-index:11}#svs{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:6px}
.pa .dl{margin-inline-start:auto}
.grid .dx{position:absolute;top:5px;inset-inline-start:5px;background:rgba(0,0,0,.55);border:0;border-radius:50%;width:26px;height:26px;font-size:12px;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
#up{z-index:9}#cl .m{max-width:92%}
.nav button{position:relative}.nav .bd{top:3px;inset-inline-end:26%}
.vb{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-inline-start:4px}
#gl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;color:#fff}
#lm{position:absolute;top:46px;inset-inline-end:0;background:rgba(255,255,255,.96);color:#0b1b45;border-radius:14px;padding:6px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#lm button{display:block;width:100%;padding:9px 12px;border:0;background:none;text-align:start;border-radius:9px;cursor:pointer;font-size:12.5px}
#lm button.on{background:#e3efff;font-weight:700}
.ttl{font-weight:700;font-size:19px;text-align:center}
.lk2{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:12px}
.pa{display:flex}.pa .bk{margin-inline-start:auto}
[dir=rtl] .back{transform:scaleX(-1)}
[data-fl]{cursor:pointer}
#cm,#fl,#cpw,#adm,#rpts{z-index:8}#sed{z-index:9;overscroll-behavior:none;touch-action:pan-x}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#sv .send button{background:var(--mid);font-size:12.5px;border-radius:22px;padding:0 18px}
#sv .send{background:#000;border:0}#sv .send input{background:#1a1a1a;border-color:#333;color:#fff}

.ring{position:relative}
.st{white-space:nowrap}.st .lb{display:block;overflow:hidden;text-overflow:ellipsis}
.plus{position:absolute;bottom:-2px;inset-inline-end:-2px;width:22px;height:22px;border-radius:50%;background:var(--mid);color:#fff;border:2px solid var(--card);display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}
#sv .bars{display:flex;gap:3px;margin:12px 12px 0}
#sv .bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;display:block}
#sv .bars i b{display:block;height:100%;width:0;background:#fff}

.stage{position:relative;overflow:hidden;background:#111;border-radius:0;flex:none;width:100%;height:100%}

.sv-viewer-avatar-wrap{position:relative;width:40px;height:40px;flex:none}.sv-viewer-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#34435e;display:block}.sv-viewer-heart{position:absolute;left:-4px;bottom:-4px;width:18px;height:18px;border:2px solid #101b3b;border-radius:50%;background:#e94f76;color:#fff;font-size:11px;display:grid;place-items:center;font-style:normal;line-height:1}

async function reportViewerComment(el){if(!me)return;const id=el.dataset.commentId,uid=el.dataset.commentUser,body=el.dataset.commentBody||'';if(!id||uid===me.id)return;if(!confirm('هل تريد الإبلاغ عن هذا التعليق؟'))return;const {error}=await sb.from('reports').insert({reporter_id:me.id,target_user_id:uid,post_id:curPost,reason:'other',details:'بلاغ عن تعليق ('+id+'): '+body.slice(0,350)});if(error){toast(error.message);return}toast(t('reportedDone'))}
async function addViewerComment(){const input=$('#postViewerInput'),v=input&&input.value.trim();if(!v||!curPost||!me)return;input.value='';const row={post_id:curPost,user_id:me.id,body:v};if(replyToComment)row.parent_id=replyToComment;const {error}=await sb.from('comments').insert(row);if(error){toast(error.message);input.value=v;return}cancelCommentReply();await renderPostViewerComments(curPost);bumpCm(1)}
function closeGridPost(){const box=$('#postViewer');if(box)box.classList.remove('on')}
async function loadCounts(){if(!me)return;const [a,b,c]=await Promise.all([sb.from('follows').select('following_id,status').eq('follower_id',me.id),sb.from('follows').select('follower_id,status').eq('following_id',me.id),sb.from('blocks').select('blocked_id').eq('blocker_id',me.id)]);following.clear();followers.clear();pendingOut.clear();blocked.clear();(a.data||[]).forEach(r=>(r.status==='pending'?pendingOut:following).add(r.following_id));(b.data||[]).forEach(r=>{if(r.status!=='pending')followers.add(r.follower_id)});(c.data||[]).forEach(r=>blocked.add(r.blocked_id));renderProfile();renderSearch();renderSet()}
async function openUser(id){if(!me)return;if(id===me.id){tab('profile');return}$$('.ov').forEach(o=>o.classList.remove('on'));$('#up').classList.add('on');$('#upb').innerHTML='<div class="note">…</div>';const [p,ps,a,b]=await Promise.all([sb.from('profiles').select('id,username,first_name,last_name,avatar_url,is_verified,bio,city,website,account_type').eq('id',id).single(),sb.from('posts').select('id,kind,image_url').eq('user_id',id).order('created_at',{ascending:false}),sb.from('follows').select('*',{count:'exact',head:true}).eq('status','accepted').eq('following_id',id),sb.from('follows').select('*',{count:'exact',head:true}).eq('status','accepted').eq('follower_id',id)]);const u=p.data;if(!u){$('#upb').innerHTML=`<div class="note">${t('noRes')}</div>`;return}const f=following.has(id),rows=ps.data||[],priv=u.account_type==='private'&&!f;$('#upt').textContent='@'+(u.username||'');$('#upb').innerHTML=`<div class="cover"></div><div class="pf"><div class="big" style="${u.avatar_url?`background-image:url(${esc(u.avatar_url)})`:''}">${u.avatar_url?'':esc(dn(u)[0])}</div><h2>${esc(dn(u))}${vbf(u.is_verified)}</h2><p><bdi>@${esc(u.username||'')}</bdi></p>${u.bio?`<p>${esc(u.bio)}</p>`:''}${u.city?`<p>${esc(u.city)}</p>`:''}<div class="stats"><div><b>${rows.length}</b><span>${t('tPosts')}</span></div><div><b>${a.count||0}</b><span>${t('followers')}</span></div><div><b>${b.count||0}</b><span>${t('following')}</span></div></div><div style="display:flex;gap:8px"><button class="pbtn" data-f="${id}">${ftxt(id)}</button><button class="pbtn" data-dm="${id}" style="background:var(--ln);color:var(--tx)">${IC.msg}</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="fb o" data-blk="${id}">${t(blocked.has(id)?'unblock':'block')}</button><button class="fb o" data-rep="user:${id}">⚑ ${t('report')}</button>${S.admin?`<button class="fb" style="background:#d6264a" data-delacct="${id}">${IC.trash} ${t('delAcct')}</button>`:''}</div></div><div class="favs" id="ufavs"></div>${priv?`<div class="note">${IC.lock} ${t('privAcct')}</div>`:''}<div class="grid">${rows.map(x=>`<div>${isVid(x.image_url)?`<video src="${esc(x.image_url)}#t=0.1" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${esc(x.image_url)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`}</div>`).join('')}</div>`;loadFavStrip(id,'#ufavs')}
async function sharePost(){if(!me)return;if(!nFile){toast(t('pickImg'));return}const kind=$('#ntype').value;toast(t('uploading'));const ext=(nFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${me.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('media').upload(path,nFile,{contentType:nFile.type});if(up.error){toast(up.error.message);return}const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;const {error}=await sb.from('posts').insert({user_id:me.id,kind,image_url:url,caption:$('#ncap').value.trim()});if(error){toast(error.message);return}nFile=null;pt=kind;await loadMyPosts();loadFeed();tab('profile');toast(t('posted'))}
function setBadge(n){const b=$('#mbd');b.textContent=n||'';b.style.display=n?'grid':'none'}
function renderChats(){$('#chats').innerHTML=convs.map(c=>{const u=peersCache[c.id]||{};const mine=c.last.sender_id===me.id;return `<button class="row" data-c="${c.id}">${av2(u)}<div class="g"><b>${esc(dn(u))}</b>${vbf(u.is_verified)}<small>${mine?'✓ ':''}${esc(chatListPreview(c.last))}</small></div>${c.unread?`<span class="bd" style="position:static">${c.unread}</span>`:''}</button>`}).join('')||`<div class="note">${t('noChats')}</div>`}
async function loadMsgs(){if(!me)return;const {data}=await sb.from('messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(300);msgsAll=data||[];const ids=[...new Set(msgsAll.map(m=>m.sender_id===me.id?m.receiver_id:m.sender_id))].filter(i=>!peersCache[i]);if(ids.length){const {data:ps}=await sb.from('profiles').select('id,username,first_name,last_name,avatar_url,is_verified,read_receipts').in('id',ids);(ps||[]).forEach(p=>peersCache[p.id]=p)}buildConvs();subscribeMsgs()}

function parseChatTheme(m){try{const v=JSON.parse(m.body||'');return v&&v.type==='chat_theme'?v:null}catch(_e){return null}}
function isChatThemeMessage(m){return !!parseChatTheme(m)}
function closeChatThemeChooser(){const el=$('#chatThemeChooser');if(el){el.classList.remove('on');el.setAttribute('aria-hidden','true')}}
function showChatThemeChooser(){$('#chatThemeAction')?.classList.remove('on');const el=$('#chatThemeChooser');if(el){el.classList.add('on');el.setAttribute('aria-hidden','false')}}
async function saveSharedChatTheme(){if(!me||!curChat)return;const body=JSON.stringify({type:'chat_theme',theme:'botanical-01',label:'Botanical'});const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:curChat,body}).select().single();if(error){toast(error.message||'تعذّر حفظ سمة المحادثة');return}if(data&&!msgsAll.some(x=>x.id===data.id))msgsAll.unshift(data);closeChatThemeChooser();renderThread();toast('تم تطبيق السمة للطرفين 🌿')}
function initChatThemeGestures(){const ml=$('#ml');if(!ml||ml.dataset.themeGesture)return;ml.dataset.themeGesture='1';let timer=null,holdShown=false;const clear=()=>{if(timer)clearTimeout(timer);timer=null};ml.addEventListener('pointerdown',e=>{clear();holdShown=false;if(e.target.closest('.m,.m-avatar,button,a,input,video,audio'))return;timer=setTimeout(()=>{holdShown=true;$('#chatThemeAction')?.classList.add('on')},560)});ml.addEventListener('pointerup',clear);ml.addEventListener('pointercancel',clear);ml.addEventListener('pointerleave',clear);ml.addEventListener('click',e=>{if(e.target.closest('.m,.m-avatar,button,a,input,video,audio'))return;if(holdShown){holdShown=false;return}const action=$('#chatThemeAction');if(action?.classList.contains('on'))action.classList.remove('on')});ml.addEventListener('contextmenu',e=>{if(!e.target.closest('.m,.m-avatar,button,a,input,video,audio')){e.preventDefault();$('#chatThemeAction')?.classList.add('on')}})}
function parseChatPayload(body){try{const j=JSON.parse(body);return j&&typeof j==='object'?j:null}catch(_){return null}}
function isChatReaction(m){const j=parseChatPayload(m&&m.body);return !!(j&&j.type==='chat_reaction')}
function isChatPayload(m,type){const j=parseChatPayload(m&&m.body);return !!(j&&j.type===type)}
function chatTextOf(m){const j=parseChatPayload(m&&m.body);return j&&j.type==='chat_text'?(j.text||''):(m&&m.body)||''}
function chatListPreview(m){const j=parseChatPayload(m&&m.body);if(!j)return (m&&m.body)||'';if(j.type==='chat_media')return j.kind==='image'?'📷 صورة':j.kind==='video'?'🎬 فيديو':'📎 ملف';if(j.type==='chat_audio')return '🎙 رسالة صوتية';if(j.type==='chat_text')return j.text||'';if(j.type==='story_reply')return '↩ رد على قصة';if(j.type==='giphy')return 'GIF';return j.type==='chat_reaction'?'تفاعل':''}
function buildConvs(){const m=new Map();for(const x of msgsAll){if(isChatThemeMessage(x)||isChatReaction(x))continue;const o=x.sender_id===me.id?x.receiver_id:x.sender_id;if(!m.has(o))m.set(o,{id:o,last:x,unread:0});if(x.receiver_id===me.id&&!x.read_at&&!getHiddenMsgIds().has(x.id))m.get(o).unread++}convs=[...m.values()].filter(c=>!blocked.has(c.id));setBadge(convs.reduce((a,c)=>a+c.unread,0));renderChats();if(curChat&&$('#chat').classList.contains('on'))renderThread()}

function showMsgContextMenu(id,x,y){const m=msgsAll.find(q=>q.id===id);if(!m)return;msgMenuTarget=id;const menu=$('#msgContextMenu');if(!menu)return;const own=m.sender_id===me.id;menu.innerHTML=`<div class="msg-menu-emojis">${['❤️','😂','😮','😢','👍','🔥'].map(em=>`<button type="button" data-menu-emoji="${em}" aria-label="${em}">${em}</button>`).join('')}</div><div class="msg-menu-actions"><button type="button" data-menu-act="reply">↩ رد على الرسالة</button><button type="button" data-menu-act="copy">⧉ نسخ</button><button type="button" data-menu-act="pin"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="m16 3 5 5-4 1-4 4-1 5-2-2-2-2 5-1 4-4z"/><path d="m9 15-5 6"/></svg> ${getPinnedMsgId()===id?'إلغاء التثبيت':'تثبيت'}</button>${own?'<button type="button" data-menu-act="delete-everyone" class="danger-everyone">حذف لدى الجميع</button>':''}<button type="button" data-menu-act="delete-me">حذف لديّ فقط</button>${own?'<button type="button" data-menu-act="edit">✎ تعديل</button>':''}</div>`;menu.classList.add('on');menu.style.visibility='hidden';menu.style.left='12px';menu.style.top='12px';const r=menu.getBoundingClientRect();const left=Math.max(12,Math.min(innerWidth-r.width-12,x-r.width/2));let top=y-r.height-14;if(top<12)top=Math.min(innerHeight-r.height-12,y+18);menu.style.left=left+'px';menu.style.top=Math.max(12,top)+'px';menu.style.visibility='visible'}

function burstMsgEmoji(emoji,x,y){const count=10;for(let i=0;i<count;i++){const el=document.createElement('span');const angle=(Math.PI*2*i/count)+(Math.random()-.5)*.28;const distance=42+Math.random()*38;el.className='msg-emoji-burst';el.textContent=emoji;el.style.setProperty('--sx',x+'px');el.style.setProperty('--sy',y+'px');el.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');el.style.setProperty('--dy',(Math.sin(angle)*distance-18)+'px');el.style.setProperty('--spin',(Math.random()*70-35)+'deg');el.style.fontSize=(23+Math.random()*12)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900)}}
async function msgMenuAction(action){const id=msgMenuTarget,m=msgsAll.find(q=>q.id===id);if(!m)return;hideMsgContextMenu();if(action==='reply'){setMsgReply(id);return}if(action==='edit'){setMsgEdit(id);return}if(action==='copy'){const text=msgPlainText(m);try{await navigator.clipboard.writeText(text);toast('تم نسخ الرسالة')}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('تم نسخ الرسالة')}return}if(action==='pin'){const old=getPinnedMsgId();try{if(old===id)localStorage.removeItem(msgLocalKey('pinned_message'));else localStorage.setItem(msgLocalKey('pinned_message'),id)}catch(_){}renderThread();toast(old===id?'تم إلغاء تثبيت الرسالة':'تم تثبيت الرسالة في محادثتك');return}if(action==='delete-me'){const hidden=getHiddenMsgIds();hidden.add(id);try{localStorage.setItem(msgLocalKey('hidden_messages'),JSON.stringify([...hidden]))}catch(_){}buildConvs();toast('حُذفت الرسالة من محادثتك فقط');return}if(action==='delete-everyone'){if(m.sender_id!==me.id){toast('يمكن لصاحب الرسالة فقط حذفها لدى الجميع');return}if(!confirm('هل تريد حذف هذه الرسالة لدى الجميع؟ لا يمكن التراجع عن ذلك.'))return;const {error}=await sb.from('messages').delete().eq('id',id).eq('sender_id',me.id);if(error){toast('تعذّر الحذف لدى الجميع: '+error.message);return}msgsAll=msgsAll.filter(q=>q.id!==id);buildConvs();toast('تم حذف الرسالة لدى الجميع')}}
function renderThread(){const u=peersCache[curChat]||{};$('#cn').innerHTML=esc(dn(u))+vbf(u.is_verified);const hidden=getHiddenMsgIds();const all=msgsAll.filter(m=>m.sender_id===curChat||m.receiver_id===curChat).slice().reverse();const themes=all.map(parseChatTheme).filter(Boolean);const activeTheme=themes.length?themes[themes.length-1].theme:null;const ml=$('#ml');if(activeTheme==='botanical-01'){ml.classList.add('chat-themed');ml.style.backgroundImage=`url("${CHAT_BOTANICAL_BG}")`}else{ml.classList.remove('chat-themed');ml.style.backgroundImage=''}const list=all.filter(m=>!isChatThemeMessage(m)&&!isChatReaction(m)&&!hidden.has(m.id));const reactions=all.filter(isChatReaction).map(m=>({...m,p:parseChatPayload(m.body)}));const pinned=getPinnedMsgId(),pin=list.find(m=>m.id===pinned);const pb=$('#msgPinBanner');if(pb){pb.classList.toggle('on',!!pin);$('#msgPinText').textContent=pin?msgPlainText(pin).slice(0,90):''}ml.innerHTML=list.map(m=>{const mine=m.sender_id===me.id;const avatar=u.avatar_url?`<img class="m-avatar" src="${esc(u.avatar_url)}" alt="" loading="lazy">`:`<div class="m-avatar" style="display:grid;place-items:center;font-weight:700">${esc((u.first_name||u.username||'R')[0])}</div>`;const body=parseChatPayload(m.body);const mineReact=reactions.filter(r=>r.p.target_id===m.id);const groups={};mineReact.forEach(r=>{const k=r.p.emoji||'❤️';if(!groups[k])groups[k]={n:0,mine:false};groups[k].n++;if(r.sender_id===me.id)groups[k].mine=true});const reacts=Object.entries(groups).map(([em,v])=>`<button type="button" class="${v.mine?'mine':''}" data-msg-react="${esc(m.id)}" data-emoji="${esc(em)}">${esc(em)} ${v.n}</button>`).join('');const textMsg=body&&body.type==='chat_text';const editable=mine&&(textMsg||!body)&&!isChatThemeMessage(m);let content=formatMsgBody(m.body,m.sender_id,m.receiver_id);if(body&&body.type==='chat_text'){const quoted=list.find(x=>x.id===body.reply_to);const quote=quoted?`<div class="msg-quote">↩ ${esc(chatListPreview(quoted).slice(0,100))}</ async function startVoiceRecord(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('تسجيل الصوت غير مدعوم في هذا المتصفح');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recordChunks,{type:mediaRecorder.mimeType||'audio/webm'});mediaRecorder=null;recordChunks=[];if(!blob.size)return;const ext=blob.type.includes('mp4')?'m4a':'webm';const file=new File([blob],`voice-${Date.now()}.${ext}`,{type:blob.type});await uploadVoiceMessage(file)};mediaRecorder.start();$('#msgRecord').innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';$('#msgRecord').classList.add('recording');toast('جارٍ التسجيل… اضغط مرة أخرى للإرسال')}catch(e){toast('لم نتمكن من تشغيل الميكروفون: '+(e.message||''))}}

function formatMsgBody(body,senderId,receiverId){
  try{
    const j=JSON.parse(body);
    if(j&&j.type==='story_reply'){
      const who=(j.from||'').replace(/^@/,'');
      const media=j.thumb||'';
      const video=!!j.video;
      const storyId=j.story_id||'';
      const ownerId=j.story_owner_id||receiverId||'';
      const owner=j.story_owner||peersCache[ownerId]||{};
      const snapshot=encodeURIComponent(JSON.stringify({id:storyId,user_id:ownerId,media_url:media,meta:j.meta||{},created_at:j.created_at||'',profiles:owner}));
      const preview=media?(video?`<video class="msg-story-video" src="${esc(media)}" muted autoplay loop playsinline preload="metadata"></video><span class="msg-story-play">▶</span>`:`<img class="msg-story-image" src="${esc(media)}" alt="معاينة القصة" loading="lazy">`):'';
      const storyCard=`<button type="button" class="msg-story-card" data-story-id="${esc(storyId)}" data-story-snapshot="${esc(snapshot)}" ${media?'':'disabled'}>${preview}<span class="msg-story-label">↩ القصة · ${esc(who||'Refa')}</span></button>`;
      return `<div class="msg-story-reply"><div class="msg-story-content">${storyCard}<div class="msg-story-text">${esc(j.text||'')}</div></div></div>`;
    }
  }catch(_){}
  try{const z=JSON.parse(body);if(z&&z.type==='giphy'&&z.url)return `<img class=\"giphy-inline\" src=\"${esc(z.url)}\" alt=\"GIPHY sticker\" loading=\"lazy\">`}catch(_){}
  if((body||'').startsWith('↩ ')) return esc(body);
  return esc(body||'');
}

function bindStoryMediaGestures(){
  const stage=document.querySelector('#sedmain .stage');if(!stage||stage.dataset.mediaGestures)return;stage.dataset.mediaGestures='1';
  const media=stage.querySelector('img,video');if(!media)return;
  const points=new Map();let base=null;
  const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
  const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const apply=()=>{media.style.transform=`translate(${ED.mediaX||0}px,${ED.mediaY||0}px) scale(${ED.mediaScale||1}) rotate(${ED.mediaRot||0}deg)`};
  stage.addEventListener('pointerdown',e=>{if(!e.target.matches('img,video'))return;e.preventDefault();points.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){};
    const pts=[...points.values()];base={scale:ED.mediaScale||1,rot:ED.mediaRot||0,x:ED.mediaX||0,y:ED.mediaY||0,dist:pts.length>1?dist(pts[0],pts[1]):0,angle:pts.length>1?angle(pts[0],pts[1]):0,mid:pts.length>1?mid(pts[0],pts[1]):pts[0]};
  });
  stage.addEventListener('pointermove',e=>{if(!points.has(e.pointerId)||!base)return;e.preventDefault();points.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...points.values()];
    if(pts.length>=2){const d=Math.max(1,dist(pts[0],pts[1]));ED.mediaScale=Math.max(.5,Math.min(4,base.scale*d/Math.max(1,base.dist)));ED.mediaRot=base.rot+angle(pts[0],pts[1])-base.angle;const m=mid(pts[0],pts[1]);ED.mediaX=base.x+(m.x-base.mid.x);ED.mediaY=base.y+(m.y-base.mid.y)}
    else{ED.mediaX=base.x+(pts[0].x-base.mid.x);ED.mediaY=base.y+(pts[0].y-base.mid.y)}apply();
  });
  const end=e=>{points.delete(e.pointerId);if(points.size){const pts=[...points.values()];base={scale:ED.mediaScale||1,rot:ED.mediaRot||0,x:ED.mediaX||0,y:ED.mediaY||0,dist:pts.length>1?dist(pts[0],pts[1]):0,angle:pts.length>1?angle(pts[0],pts[1]):0,mid:pts.length>1?mid(pts[0],pts[1]):pts[0]}}else base=null};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>stage.addEventListener(ev,end));
}

function renderMusSticker(){
  if(!ED)return;
  const stage=document.querySelector('#sedmain .stage');
  if(!stage)return;
  stage.querySelectorAll('.mus-sticker,.mus-text,.mus-guide,.mus-guide-h').forEach(e=>e.remove());
  if(!ED.mu&&!ED.mf)return;
  ED.musScale=ED.musScale||1; ED.musRot=ED.musRot||0;
  const title=(ED.mt||'Music').split(' — ')[0];
  const artist=(ED.mt||'').includes(' — ')?ED.mt.split(' — ')[1]:'';
  const art=(ED.mu&&ED.mu.a)?ED.mu.a:'';
  const gv=document.createElement('div');gv.className='mus-guide';stage.appendChild(gv);
  const gh=document.createElement('div');gh.className='mus-guide-h';stage.appendChild(gh);
  const el=document.createElement('div');
  el.className='mus-sticker it ed';
  el.innerHTML='<div class="ms-art" style="background-image:url('+art+')"></div><div class="ms-info"><div class="ms-title"><span class="scroll">♪ '+title+' &nbsp;&nbsp;&nbsp; ♪ '+title+' &nbsp;&nbsp;&nbsp; </span></div><div class="ms-artist">'+artist+'</div></div>';
  const applyT=()=>{el.style.left=(ED.musX*100)+'%';el.style.top=(ED.musY*100)+'%';el.style.transform='translate(-50%,-50%) scale('+ED.musScale+') rotate('+ED.musRot+'deg)'};
  applyT();
  stage.appendChild(el);
  let drag=null, pinch=null;
  const SNAP=0.04;
  const dist=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
  const ang=(a,b)=>Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)*180/Math.PI;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    if(!el._pts)el._pts=new Map();
    el._pts.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
    const pts=[...el._pts.values()];
    if(pts.length===1){
      const r=stage.getBoundingClientRect();
      drag={dx:e.clientX-(r.left+ED.musX*r.width),dy:e.clientY-(r.top+ED.musY*r.height)};
      pinch=null;
      gv.classList.add('on');gh.classList.add('on');
    }else if(pts.length>=2){
      drag=null;
      pinch={d0:dist(pts[0],pts[1]),a0:ang(pts[0],pts[1]),s0:ED.musScale,r0:ED.musRot};
    }
  });
  el.addEventListener('pointermove',e=>{
    if(!el._pts||!el._pts.has(e.pointerId))return;
    el._pts.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
    const pts=[...el._pts.values()];
    if(pinch&&pts.length>=2){
      const d=dist(pts[0],pts[1]);
      const a=ang(pts[0],pts[1]);
      ED.musScale=Math.min(2.8,Math.max(0.45,+(pinch.s0*(d/pinch.d0)).toFixed(3)));
      ED.musRot=((pinch.r0+(a-pinch.a0))+360)%360;
      applyT();
      return;
    }
    if(drag&&pts.length===1){
      const r=stage.getBoundingClientRect();
      let nx=(e.clientX-drag.dx-r.left)/r.width;
      let ny=(e.clientY-drag.dy-r.top)/r.height;
      if(Math.abs(nx-0.5)<SNAP)nx=0.5;
      if(Math.abs(ny-0.5)<SNAP)ny=0.5;
      ED.musX=Math.min(1,Math.max(0,nx));
      ED.musY=Math.min(1,Math.max(0,ny));
      applyT();
      gv.style.opacity=Math.abs(ED.musX-0.5)<SNAP?1:0.35;
      gh.style.opacity=Math.abs(ED.musY-0.5)<SNAP?1:0.35;
    }
  });
  const endP=e=>{
    if(el._pts)el._pts.delete(e.pointerId);
    if(!el._pts||el._pts.size<2)pinch=null;
    if(!el._pts||el._pts.size===0){drag=null;gv.classList.remove('on');gh.classList.remove('on')}
    if(el._pts&&el._pts.size===1){
      const p=[...el._pts.values()][0];
      const r=stage.getBoundingClientRect();
      drag={dx:p.clientX-(r.left+ED.musX*r.width),dy:p.clientY-(r.top+ED.musY*r.height)};
    }
  };
  el.addEventListener('pointerup',endP);
  el.addEventListener('pointercancel',endP);
}

  if(readErr){toast('تعذر قراءة القائمة: '+readErr.message);return false}
  const current=(rows||[]).map(r=>r.friend_id).filter(Boolean);
  const add=wanted.filter(id=>!current.includes(id));
  const remove=current.filter(id=>!wanted.includes(id));
  if(add.length){
    const {error}=await sb.from('close_friends').insert(add.map(friend_id=>({user_id:me.id,friend_id})));

  }

}

else if(b=c('[data-f]')){const id=b.dataset.f;if(!me)return;if(following.has(id)||pendingOut.has(id)){await sb.from('follows').delete().match({follower_id:me.id,following_id:id});following.delete(id);pendingOut.delete(id)}else{const {data,error}=await sb.from('follows').insert({follower_id:me.id,following_id:id}).select('status').single();if(error){toast(error.message);return}if(data&&data.status==='pending'){pendingOut.add(id);toast(t('requestSent'))}else following.add(id)}renderSearch();renderProfile();if($('#fl').classList.contains('on'))renderFl();if($('#up').classList.contains('on'))openUser(id)}

else if(b=c('[data-rep]')){const [ty,id,uid]=b.dataset.rep.split(':');repT={ty,id,uid:uid||(ty==='user'?id:null)};$('#rdet').value='';$('#rep').classList.add('on')}

else if(b=c('[data-pt]')){pt=b.dataset.pt;renderProfile()}
else if(c('#mr')){notes.forEach(n=>n.u=0);renderNotes();if(me)sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false)}

else if(c('#setBtn'))$('#set').classList.add('on');
else if(c('#editBtn')||c('#pAv'))openEdit();
else if(c('#chPh')||c('#eAv'))$('#file').click();

else if(c('#share'))sharePost();
else if(c('#save'))saveProfile();
else if((b=c('[data-uid]'))&&b.dataset.uid)openUser(b.dataset.uid);
else if(c('#lo')){sb.auth.signOut();me=null;S.admin=false;verified.delete('me');P={fn:'',ln:'',nk:'',bd:'',ct:'',bi:'',ph:'',wb:'',gd:'',un:''};items.length=0;stGroups=[];seenSt=new Set();favRows={};$('#favs').innerHTML='';following.clear();followers.clear();feedRows=[];reelRows=[];msgsAll=[];convs=[];curChat=null;favSongs=[];favLoaded=false;if(msgChan){sb.removeChannel(msgChan);msgChan=null}notes=[];if(noteChan){sb.removeChannel(noteChan);noteChan=null}renderAll();showG('lgp');$$('.ov').forEach(o=>o.classList.remove('on'));$('#app').classList.remove('on');$('#login').classList.add('on')}});
document.addEventListener('change',async e=>{const x=e.target;
if(['chatFile','chatGallery','chatCamera'].includes(x.id)&&x.files&&x.files.length){const files=[...x.files];x.value='';await uploadChatFiles(files)}
else if(x.id==='file'&&x.files[0]&&me){const f=x.files[0];P.ph=URL.createObjectURL(f);paintAv($('#eAv'));const path=`${me.id}/avatar-${Date.now()}.${(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')}`;const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});if(up.error){toast(up.error.message);return}const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;const {error}=await sb.from('profiles').update({avatar_url:url}).eq('id',me.id);if(error){toast(error.message);return}P.ph=url;paintAv($('#pAv'));renderStories();toast(t('saveToast'))}
else if(x.id==='sfile'&&x.files[0]&&me){const f=x.files[0];x.value='';openEditor(f)}
else if(x.id==='nfile'&&x.files[0]){nFile=x.files[0];nImg=URL.createObjectURL(x.files[0]);$('#nAv').style.backgroundImage=`url(${nImg})`;$('#nAv').textContent=''}
else if(x.dataset.s==='lang')setLang(x.value);
else if(x.dataset.s){const k=x.dataset.s;S[k]=x.type==='checkbox'?x.checked:x.value;if(k==='theme')applyTheme();if(k==='acct'&&x.value==='private')S.fol='approval';if(k==='rec'&&me)sb.from('profiles').update({read_receipts:x.checked}).eq('id',me.id);if(k==='msg'&&me)sb.from('profiles').update({message_privacy:x.value}).eq('id',me.id);if(k==='acct'&&me)sb.from('profiles').update({account_type:x.value}).eq('id',me.id);renderNotes();renderSet()}});
