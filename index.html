<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refa</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#00d1ff;--mid:#1478c8;--navy:#0a1f6e;--bg:#f5f9ff;--card:#fff;--tx:#0b1b45;--mu:#5d6b8f;--ln:#dde6f5;--mk:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d24;--card:#0e1a3d;--tx:#eaf1ff;--mu:#8fa0cc;--ln:#1c2b5a;--mk:brightness(0) invert(1)}}
:root[data-theme="dark"]{--bg:#060d24;--card:#0e1a3d;--tx:#eaf1ff;--mu:#8fa0cc;--ln:#1c2b5a;--mk:brightness(0) invert(1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-size:13px;line-height:1.4;font-family:Outfit,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[lang=ar] body,[lang=ar] input,[lang=ar] button,[lang=ar] select,[lang=ar] textarea{font-family:Cairo,Outfit,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.screen{display:none;height:100%;width:100%;max-width:440px;margin:auto;position:relative;overflow:hidden}
.screen.on{display:flex;flex-direction:column}
#login{max-width:none;background:linear-gradient(135deg,#041046,#0a3a9c 50%,#0099d8);align-items:center;justify-content:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:drift 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#00d1ff;top:-80px;left:-60px}
.b2{width:300px;height:300px;background:#1b4fd8;bottom:-60px;right:-40px;animation-duration:18s}
.b3{width:220px;height:220px;background:#5ae6ff;top:45%;left:55%;animation-duration:11s;opacity:.45}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:3}
.lang select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:8px 14px;backdrop-filter:blur(8px)}
.lang option{color:#0b1b45}
.glass{position:relative;z-index:2;width:min(400px,92%);padding:24px 22px;border-radius:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px);color:#fff;display:flex;flex-direction:column;gap:12px;max-height:96%;overflow:auto}
.logo{text-align:center}
.logo img{height:68px;filter:brightness(0) invert(1)}
.logo b{display:block;font-size:28.5px;margin-top:4px}
.glass input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;outline:none}
.glass input::placeholder{color:rgba(255,255,255,.7)}
.glass input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:600;cursor:pointer;width:100%}
.pri{background:#fff;color:var(--navy)}
.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff}
.sep{display:flex;align-items:center;gap:10px;font-size:11px;opacity:.85}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.4)}
.soc{display:flex;gap:8px}
.soc button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:11px}
.soc i{font-style:normal;font-weight:700;display:block;font-size:14.5px}
.sm{font-size:11px;text-align:center;opacity:.85}
#app{background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--card)}
.top img{height:30px;filter:var(--mk)}
.top .r{display:flex}
.top button,.ic{background:none;border:0;font-size:17.5px;cursor:pointer;padding:6px;position:relative}
.bd{position:absolute;top:0;inset-inline-end:0;background:#ef3b5d;color:#fff;font-size:8.5px;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.pages{flex:1;overflow:auto;position:relative}
.pg{display:none;min-height:100%}.pg.on{display:block}
#reels.on{display:block;height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
.nav button{flex:1;padding:11px 0 9px;background:none;border:0;font-size:17px;cursor:pointer;color:var(--mu)}
.nav button span{display:block;font-size:9px;margin-top:2px}
.nav button.on{color:var(--mid)}
.stories{display:flex;gap:14px;padding:14px 14px 10px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--ln)}
.st{flex:none;width:68px;text-align:center;font-size:10px;cursor:pointer;background:none;border:0}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(var(--cy),var(--mid),var(--navy),var(--cy));margin-bottom:5px}
.ring.me{background:var(--ln)}
.av{width:100%;height:100%;border-radius:50%;border:3px solid var(--card);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background-size:cover;background-position:center}
.post{background:var(--card);margin-top:8px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600;font-size:12px}
.ph .av{width:34px;height:34px;border:0;font-size:12px;flex:none}
.img{aspect-ratio:1;display:grid;place-items:center;font-size:54px}
.pa{padding:8px 10px}.pa button{background:none;border:0;font-size:19.5px;cursor:pointer;padding:4px 6px}
.cap{padding:0 14px 14px;font-size:12px}.cap b{margin-inline-end:6px}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;color:#fff;padding:20px 16px}
.reel .big{position:absolute;inset:0;display:grid;place-items:center;font-size:75.5px;opacity:.9}
.reel .info{position:relative;flex:1;font-size:12px;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.reel .side{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;text-align:center;font-size:10px}
.reel .side button{background:none;border:0;color:#fff;font-size:23.5px;cursor:pointer;display:block;margin:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:0;border-bottom:1px solid var(--ln);width:100%;text-align:start}
button.row{cursor:pointer}
.row .av{width:46px;height:46px;border:0;flex:none}
.row .g{flex:1;font-size:12px;min-width:0}
.row small{display:block;color:var(--mu);font-size:10.5px}
.sb{margin:12px 16px 8px;width:calc(100% - 32px);padding:11px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--card);outline:none}
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.chip{flex:none;padding:7px 14px;border-radius:18px;border:1px solid var(--ln);background:var(--card);cursor:pointer;font-size:11px}
.chip.on{background:linear-gradient(135deg,var(--mid),var(--navy));color:#fff;border-color:transparent}
.fb{padding:7px 14px;border-radius:10px;border:0;background:var(--mid);color:#fff;font-weight:600;cursor:pointer;font-size:11px}
.fb.o{background:var(--ln);color:var(--tx)}
.sec{padding:14px 16px 6px;font-weight:700;font-size:12.5px}
.ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.ov.on{display:flex}
#chat{z-index:5}#edit{z-index:6}#set{z-index:7}#newp{z-index:8}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:10px 14px;border-radius:18px;font-size:12px;background:var(--card);align-self:flex-start;border:1px solid var(--ln)}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--cy),var(--navy));color:#fff;border:0}
.send{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--ln)}
.send input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid var(--ln);background:var(--bg);outline:none}
.send button{border:0;border-radius:22px;padding:0 18px;background:var(--mid);color:#fff;cursor:pointer}
.cover{height:110px;background:linear-gradient(120deg,var(--cy),var(--mid),var(--navy));position:relative}
.cover button{position:absolute;top:10px;inset-inline-end:10px;background:rgba(0,0,0,.25);color:#fff;border-radius:50%;width:36px;height:36px;padding:0}
.pf{padding:0 18px 14px;background:var(--card)}
.pf .big{width:96px;height:96px;margin-top:-48px;border-radius:50%;border:4px solid var(--card);background:var(--ln) center/cover;display:grid;place-items:center;font-size:28.5px;font-weight:700;color:var(--mu);cursor:pointer;position:relative;z-index:2}
.pf h2{font-size:18.5px;margin-top:8px}.pf p{color:var(--mu);font-size:12px;margin-top:2px}
.stats{display:flex;gap:26px;margin:14px 0}.stats b{display:block;font-size:15px}.stats span{color:var(--mu);font-size:11px}
.pbtn{width:100%;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--mid),var(--navy));color:#fff;font-weight:600;cursor:pointer}
.ptabs{display:flex;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}
.ptabs button{flex:1;padding:12px 0;background:none;border:0;border-bottom:2px solid transparent;font-size:16px;cursor:pointer;color:var(--mu)}
.ptabs button span{display:block;font-size:9px}
.ptabs button.on{color:var(--mid);border-color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}
.grid div{aspect-ratio:1;display:grid;place-items:center;font-size:25px;position:relative;background-size:cover;background-position:center}
.grid div i{position:absolute;top:5px;inset-inline-end:7px;font-style:normal;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.note{padding:10px 16px;font-size:11px;color:var(--mu);text-align:center}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:5px}
.form input:not([type=checkbox]),.form textarea,.form select{padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phot{display:flex;flex-direction:column;align-items:center;gap:8px}
.phot .big{width:104px;height:104px;border-radius:50%;background:var(--ln) center/cover;display:grid;place-items:center;font-size:30px;cursor:pointer}
.phot button{background:none;border:0;color:var(--mid);font-weight:600;cursor:pointer}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln);font-size:12px}
.sr small{display:block;color:var(--mu);font-size:10px;margin-top:2px}
.sr select{padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw:checked{background:var(--mid)}.sw:checked:after{inset-inline-start:21px}
.out{margin:18px 16px;padding:12px;border-radius:12px;border:1px solid #ef3b5d;background:none;color:#ef3b5d;font-weight:600;cursor:pointer}
#sv{position:absolute;inset:0;z-index:9;display:none;background:#000;color:#fff;flex-direction:column}
#sv.on{display:flex}
#sv .bar{height:3px;background:rgba(255,255,255,.3);margin:12px 12px 0;border-radius:2px;overflow:hidden}
#sv .bar i{display:block;height:100%;width:0;background:#fff}
#sv .bar i.go{width:100%;transition:width 4s linear}
#sv .body{flex:1;display:grid;place-items:center;font-size:92.5px}
#sv .who{padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
#sv button{background:none;border:0;color:#fff;font-size:18.5px;cursor:pointer}
.hd{font-weight:700}
.hide{display:none!important}
.pa .dl{margin-inline-start:auto}
.grid .dx{position:absolute;top:5px;inset-inline-start:5px;background:rgba(0,0,0,.55);border:0;border-radius:50%;width:26px;height:26px;font-size:12px;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
#up{z-index:9}#cl .m{max-width:92%}
.nav button{position:relative}.nav .bd{top:3px;inset-inline-end:26%}
.vb{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-inline-start:4px}
#gl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;color:#fff}
#lm{position:absolute;top:46px;inset-inline-end:0;background:rgba(255,255,255,.96);color:#0b1b45;border-radius:14px;padding:6px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#lm button{display:block;width:100%;padding:9px 12px;border:0;background:none;text-align:start;border-radius:9px;cursor:pointer;font-size:12.5px}
#lm button.on{background:#e3efff;font-weight:700}
.ttl{font-weight:700;font-size:19px;text-align:center}
.lk2{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:12px}
.pa{display:flex}.pa .bk{margin-inline-start:auto}
[dir=rtl] .back{transform:scaleX(-1)}
[data-fl]{cursor:pointer}
#cm,#fl,#cpw,#adm{z-index:8}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#sv .send button{background:var(--mid);font-size:12.5px;border-radius:22px;padding:0 18px}
#sv .send{background:#000;border:0}#sv .send input{background:#1a1a1a;border-color:#333;color:#fff}
</style>
</head>

setLang(['ar','fr'].includes(nl)?nl:'en');
sb.auth.onAuthStateChange(async(ev,ss)=>{if(ev==='PASSWORD_RECOVERY'&&ss){await loadMe(ss.user);enter();$('#cperr').textContent='';$('#cpw').classList.add('on')}});
sb.auth.getSession().then(async({data})=>{if(data.session&&!me){await loadMe(data.session.user);enter()}});
