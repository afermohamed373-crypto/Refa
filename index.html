<style>
.ico{vertical-align:-.15em;display:inline-block}
:root{--cy:#00d1ff;--mid:#1478c8;--navy:#0a1f6e;--bg:#f5f9ff;--card:#fff;--tx:#0b1b45;--mu:#5d6b8f;--ln:#dde6f5;--mk:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%}
body{font-size:13px;line-height:1.4;font-family:Outfit,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx)}

.mprev-play{background:#fff;color:#000;min-width:48px}
.mprev-add{background:linear-gradient(135deg,#00d1ff,#1478c8);color:#fff;flex:1}
.mprev-fav{background:#333;color:#fff;min-width:48px}
.mprev-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.mhandle{width:40px;height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin:8px auto 4px;cursor:pointer}
.mprog{height:6px;background:#2a2a2a;border-radius:3px;margin:10px 0 6px;overflow:hidden;position:relative}
.mprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00d1ff,#1478c8);border-radius:3px;transition:width .08s linear}
.mtime{display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-bottom:6px}
.mtime b{font-weight:600;color:#00d1ff}
.mcur{background:#1a1a1a;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #2a2a2a}
.mrw2{padding:4px 0}
.madd{background:rgba(0,209,255,.15)!important;border-radius:50%!important;width:36px;height:36px;display:grid;place-items:center;padding:0!important}

.cfmodal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:25;display:none;align-items:flex-end;justify-content:center}
.cfmodal.on{display:flex}
.cfcard{background:#1c1c1e;border-radius:20px 20px 0 0;width:100%;max-height:60vh;padding:16px;overflow:auto}
.cfcard h3{text-align:center;margin-bottom:12px;font-size:16px}
.cfrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2a2a2a}
.cfrow .av{width:40px;height:40px;border-radius:50%;background:#333 center/cover;flex:none}
.cfrow label{flex:1;font-size:14px}
.cfrow input{width:20px;height:20px}
.cfactions{display:flex;gap:10px;margin-top:14px}
.cfactions button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:600;cursor:pointer}
.cfok{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.cfcancel{background:#333;color:#fff}


.madd{font-size:18px;padding:6px 12px;flex:none;background:rgba(0,209,255,.2);border-radius:10px;border:0;color:#fff;cursor:pointer;line-height:1}
.mrw2 .mstar{opacity:.6;font-size:14px}

</style>
